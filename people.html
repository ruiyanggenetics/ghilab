<h1>People</h1>

<section class="people-section">
  <h2>Lab Members</h2>
  <div id="people-lab-members" class="people-grid">
    <p class="pub-desc">Loading lab members...</p>
  </div>
</section>

<section class="people-section">
  <h2>Alumni</h2>
  <div id="people-alumni" class="people-grid">
    <p class="pub-desc">Loading alumni...</p>
  </div>
</section>

<section class="people-section">
  <h2>Close collaborators</h2>
  <div id="people-close-collaborators" class="people-grid">
    <p class="pub-desc">Loading collaborators...</p>
  </div>
</section>

<script>
/* =========================
   CONFIG
   ========================= */
const SHEET_ID   = "166QgKaRxVyZuTKAfiX9XLXNVgW6dnsd-10VvFB7nJxg";
const SHEET_NAME = "Sheet1";
const RAW_BASEURL = "{{ site.baseurl }}";
const BASEURL = RAW_BASEURL.includes("{") ? "" : RAW_BASEURL;
const DEFAULT_PHOTO = BASEURL ? BASEURL + "/assets/img/people/default-turtle.png" : "assets/img/people/default-turtle.png";
const STATIC_PI = {
  name: "Rui (Ray) Yang, MD, PhD",
  category: "Principal Investigator",
  title: "Principal Investigator",
  photo: "/assets/img/rui-yang-photo.png",
  startDate: "",
  endDate: "",
  biography: "Dr. Rui (Ray) Yang is a board-certified pediatrician and incoming tenure-track assistant professor at Baylor College of Medicine (BCM). He will launch his laboratory at Texas Children's Hospital in summer 2026. His research focuses on monogenic causes of life-threatening infectious diseases, immune dysregulation, and malignancies."
};

const GVIZ_URL =
  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;

/* =========================
   HELPERS
   ========================= */
function cleanText(v) {
  return (v === null || v === undefined) ? "" : String(v).trim();
}

function normKey(v) {
  return cleanText(v).toLowerCase().replace(/[^a-z0-9]+/g, "");
}

function normCategory(v) {
  return cleanText(v).toLowerCase().replace(/\s+/g, " ");
}

function firstName(v) {
  return cleanText(v).split(/\s+/)[0].toLowerCase();
}

function isCloseCollaborator(person) {
  const category = normCategory(person.category);
  return category === "close collaborator" || category === "close collaborators";
}

function isAlumni(person) {
  const category = normCategory(person.category);
  return category === "alumni" || category === "alumnus" || category === "alumna";
}

function isPrincipalInvestigator(person) {
  const category = normCategory(person.category);
  const title = normCategory(person.title);
  return category === "principal investigator" || title.includes("principal investigator");
}

function fallbackTitle(person) {
  if (person.title) return person.title;
  if (isPrincipalInvestigator(person)) return "Principal Investigator";
  if (isAlumni(person)) return "Alumni";
  if (isCloseCollaborator(person)) return "Close collaborator";
  return "Lab member";
}

function parseGvizDate(v) {
  // gviz sometimes returns Date(YYYY,MM,DD) (MM is 0-based)
  if (!v) return "";
  if (typeof v === "string" && v.startsWith("Date")) {
    const parts = v.match(/\d+/g);
    if (!parts || parts.length < 3) return "";
    const y = Number(parts[0]);
    const m = Number(parts[1]);
    const d = Number(parts[2]);
    const dt = new Date(y, m, d);
    return isNaN(dt.getTime()) ? "" : dt.toLocaleDateString("en-US");
  }
  return cleanText(v);
}

function safePhoto(photoPath) {
  const p = cleanText(photoPath);
  if (!p) return DEFAULT_PHOTO;

  if (/^https?:\/\//i.test(p)) return p;
  if (!BASEURL && window.location.protocol === "file:" && p.startsWith("/")) return p.replace(/^\/+/, "");
  if (!BASEURL && p.startsWith("/")) return p;
  if (p.startsWith("/")) return BASEURL + p;
  if (!BASEURL) return p;
  return BASEURL + "/" + p;
}

function makeHeaderMap(cols) {
  const fallback = {
    name: 0,
    category: 1,
    title: 2,
    photo: 3,
    startdate: 4,
    enddate: 5,
    biography: 6
  };

  const map = {};
  cols.forEach((col, index) => {
    const key = normKey(col.label || col.id);
    if (key) map[key] = index;
  });

  return { ...fallback, ...map };
}

function cellValue(row, map, key) {
  return row.c?.[map[key]]?.v;
}

function datesFor(person) {
  const start = parseGvizDate(person.startDate);
  const end = parseGvizDate(person.endDate);

  if (!start && !end) return "";
  if (start && end) return `${start}-${end}`;
  return start || end;
}

function compareByFirstName(a, b) {
  return firstName(a.name).localeCompare(firstName(b.name), undefined, { sensitivity: "base" });
}

function compareLabMembers(a, b) {
  const aPi = isPrincipalInvestigator(a);
  const bPi = isPrincipalInvestigator(b);

  if (aPi && !bPi) return -1;
  if (!aPi && bPi) return 1;
  return compareByFirstName(a, b);
}

function ensurePrincipalInvestigator(people) {
  const hasRui = people.some(person => normCategory(person.name).includes("rui") && normCategory(person.name).includes("yang"));
  return hasRui ? people : [STATIC_PI, ...people];
}

function makeCard(person) {
  const card = document.createElement("div");
  card.className = "person-card";

  const img = document.createElement("img");
  img.src = safePhoto(person.photo);
  img.alt = person.name;

  const info = document.createElement("div");
  info.className = "person-info";

  const name = document.createElement("div");
  name.className = "person-name";
  name.textContent = person.name;
  info.appendChild(name);

  const role = document.createElement("div");
  role.className = "person-role";
  role.textContent = fallbackTitle(person);
  info.appendChild(role);

  const dates = datesFor(person);
  if (dates) {
    const dateEl = document.createElement("div");
    dateEl.className = "person-dates";
    dateEl.textContent = dates;
    info.appendChild(dateEl);
  }

  if (person.biography) {
    const bio = document.createElement("div");
    bio.className = "person-bio";
    bio.textContent = person.biography;
    info.appendChild(bio);
  }

  card.appendChild(img);
  card.appendChild(info);
  return card;
}

function setEmpty(container, msg) {
  container.innerHTML = `<p class="pub-desc">${msg}</p>`;
}

function renderPeople(container, people, emptyMessage) {
  container.innerHTML = "";

  if (!people.length) {
    setEmpty(container, emptyMessage);
    return;
  }

  people.forEach(person => {
    container.appendChild(makeCard(person));
  });
}

/* =========================
   FETCH + RENDER
   ========================= */
document.addEventListener("DOMContentLoaded", async () => {
  const labMembersEl = document.getElementById("people-lab-members");
  const alumniEl     = document.getElementById("people-alumni");
  const collabEl     = document.getElementById("people-close-collaborators");

  if (!labMembersEl || !alumniEl || !collabEl) return;

  try {
    const res = await fetch(GVIZ_URL);
    const text = await res.text();

    const m = text.match(/google\.visualization\.Query\.setResponse\((.*)\);?$/s);
    if (!m || !m[1]) throw new Error("Could not parse GViz response.");
    const json = JSON.parse(m[1]);

    const rows = json.table?.rows || [];
    const map = makeHeaderMap(json.table?.cols || []);

    const people = rows.map(row => ({
      name: cleanText(cellValue(row, map, "name")),
      category: cleanText(cellValue(row, map, "category")),
      title: cleanText(cellValue(row, map, "title")),
      photo: cleanText(cellValue(row, map, "photo")),
      startDate: cellValue(row, map, "startdate"),
      endDate: cellValue(row, map, "enddate"),
      biography: cleanText(cellValue(row, map, "biography"))
    })).filter(person => person.name);

    const labMembers = ensurePrincipalInvestigator(
      people.filter(person => !isAlumni(person) && !isCloseCollaborator(person))
    ).sort(compareLabMembers);

    const alumni = people
      .filter(isAlumni)
      .sort(compareByFirstName);

    const collaborators = people
      .filter(isCloseCollaborator)
      .sort(compareByFirstName);

    renderPeople(labMembersEl, labMembers, "No lab members listed.");
    renderPeople(alumniEl, alumni, "No alumni listed.");
    renderPeople(collabEl, collaborators, "No close collaborators listed.");

  } catch (err) {
    console.error(err);
    renderPeople(labMembersEl, [STATIC_PI], "Error loading people.");
    setEmpty(alumniEl, "Error loading people.");
    setEmpty(collabEl, "Error loading people.");
  }
});
</script>
