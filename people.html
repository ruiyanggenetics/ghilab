  </div>

<script>
/* =========================
   CONFIG
   ========================= */
const SHEET_ID   = "166QgKaRxVyZuTKAfiX9XLXNVgW6dnsd-10VvFB7nJxg";
const SHEET_NAME = "Sheet1";
const RAW_BASEURL = "{{ site.baseurl }}";
const BASEURL = RAW_BASEURL.includes("{") ? "" : RAW_BASEURL;
const DEFAULT_PHOTO = BASEURL ? BASEURL + "/assets/img/people/default-turtle.png" : "assets/img/people/default-turtle.png";
const SVG_NS = "http://www.w3.org/2000/svg";
const GHI_LOCATION = {
  label: "GHI",
  lat: 29.7104,
  lng: -95.3972
};
const STATIC_PI = {
  name: "Rui (Ray) Yang, MD, PhD",
  category: "Principal Investigator",
  title: "Principal Investigator",
  photo: "/assets/img/rui-yang-photo.png",
  startDate: "",
  endDate: "",
  cityOfOrigin: "30.647643816147752, 111.34987189261312",
  biography: "Dr. Rui (Ray) Yang is a board-certified pediatrician and incoming tenure-track assistant professor at Baylor College of Medicine (BCM). He will launch his laboratory at Texas Children's Hospital in summer 2026. His research focuses on monogenic causes of life-threatening infectious diseases, immune dysregulation, and malignancies."
};

const GVIZ_URL =
  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;

/* =========================
   HELPERS
   ========================= */
function cleanText(v) {
  return (v === null || v === undefined) ? "" : String(v).trim();
}

function normKey(v) {
  return cleanText(v).toLowerCase().replace(/[^a-z0-9]+/g, "");
}

function normCategory(v) {
  return cleanText(v).toLowerCase().replace(/\s+/g, " ");
}

function firstName(v) {
  return cleanText(v).split(/\s+/)[0].toLowerCase();
}

function isCloseCollaborator(person) {
  const category = normCategory(person.category);
  return category === "close collaborator" || category === "close collaborators";
}

function isAlumni(person) {
  const category = normCategory(person.category);
  return category === "alumni" || category === "alumnus" || category === "alumna";
}

function isPrincipalInvestigator(person) {
  const category = normCategory(person.category);
  const title = normCategory(person.title);
  return category === "principal investigator" || title.includes("principal investigator");
}

function isRuiYang(person) {
  const name = normCategory(person.name);
  return name.includes("rui") && name.includes("yang");
}

function withPrincipalInvestigatorFallback(person) {
  if (!isRuiYang(person)) return person;

  return {
    ...person,
    category: person.category || STATIC_PI.category,
    title: person.title || STATIC_PI.title,
    photo: person.photo || STATIC_PI.photo,
    cityOfOrigin: person.cityOfOrigin || STATIC_PI.cityOfOrigin,
    biography: person.biography || STATIC_PI.biography
  };
}

function fallbackTitle(person) {
  if (person.title) return person.title;
  if (isPrincipalInvestigator(person)) return "Principal Investigator";
  if (isAlumni(person)) return "Alumni";
  if (isCloseCollaborator(person)) return "Close collaborator";
  return "Lab member";
}

function parseGvizDate(v) {
  // gviz sometimes returns Date(YYYY,MM,DD) (MM is 0-based)
  if (!v) return "";
  if (typeof v === "string" && v.startsWith("Date")) {
    const parts = v.match(/\d+/g);
    if (!parts || parts.length < 3) return "";
    const y = Number(parts[0]);
    const m = Number(parts[1]);
    const d = Number(parts[2]);
    const dt = new Date(y, m, d);
    return isNaN(dt.getTime()) ? "" : dt.toLocaleDateString("en-US");
  }
  return cleanText(v);
}

function safePhoto(photoPath) {
  const p = cleanText(photoPath);
  if (!p) return DEFAULT_PHOTO;

  if (/^https?:\/\//i.test(p)) return p;
  if (!BASEURL && window.location.protocol === "file:" && p.startsWith("/")) return p.replace(/^\/+/, "");
  if (!BASEURL && p.startsWith("/")) return p;
  if (p.startsWith("/")) return BASEURL + p;
  if (!BASEURL) return p;
  return BASEURL + "/" + p;
}

function makeHeaderMap(cols) {
  const fallback = {
    name: 0,
    category: 1,
    title: 2,
    photo: 3,
    startdate: 4,
    enddate: 5,
    cityoforigin: 6,
    biography: 7
  };

  const map = {};
  const aliases = {
    cityoforigin: "cityoforigin",
    origin: "cityoforigin",
    coordinates: "cityoforigin",
    coordinate: "cityoforigin",
    hometown: "cityoforigin"
  };

  cols.forEach((col, index) => {
    const rawKey = normKey(col.label || col.id);
    const key = aliases[rawKey] || rawKey;
    if (key) map[key] = index;
  });

  return { ...fallback, ...map };
}

function isPeopleHeaderRow(row) {
  const keys = (row.c || []).map(cell => normKey(cell?.f || cell?.v));
  return keys.includes("name") && keys.includes("category");
}

function makeHeaderMapFromRow(row) {
  return makeHeaderMap((row.c || []).map(cell => ({
    label: cell?.f || cell?.v
  })));
}

function cellValue(row, map, key) {
  const value = row.c?.[map[key]];
  return value?.v || value?.f;
}

function escapeHtml(value) {
  return cleanText(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function parseCoordinates(value) {
  const parts = cleanText(value).split(",").map(part => Number(part.trim()));
  if (parts.length < 2 || parts.some(Number.isNaN)) return null;

  const lat = parts[0];
  const lng = parts[1];
  if (lat < -90 || lat > 90 || lng < -180 || lng > 180) return null;

  return { lat, lng };
}

function findCoordinateCell(row) {
  const cells = row.c || [];

  for (const cell of cells) {
    const value = cleanText(cell?.v || cell?.f);
    if (parseCoordinates(value)) return value;
  }

  return "";
}

function coordinateToPoint(lat, lng) {
  return {
    x: ((lng + 180) / 360) * 100,
    y: ((90 - lat) / 180) * 100
  };
}

function routePath(start, end, index) {
  const dx = end.x - start.x;
  const dy = end.y - start.y;
  const length = Math.hypot(dx, dy) || 1;
  const midX = (start.x + end.x) / 2;
  const midY = (start.y + end.y) / 2;
  const curve = Math.min(14, Math.max(5, length * 0.18)) * (index % 2 ? -1 : 1);
  const controlX = midX - (dy / length) * curve;
  const controlY = midY + (dx / length) * curve;

  return [
    `M ${start.x.toFixed(2)} ${start.y.toFixed(2)}`,
    `Q ${controlX.toFixed(2)} ${controlY.toFixed(2)} ${end.x.toFixed(2)} ${end.y.toFixed(2)}`
  ].join(" ");
}

function appendRoute(svg, start, end, index) {
  const addPath = (routeStart, routeEnd) => {
    const path = document.createElementNS(SVG_NS, "path");
    path.setAttribute("class", "people-map-route");
    path.setAttribute("d", routePath(routeStart, routeEnd, index));
    svg.appendChild(path);
  };

  const dx = end.x - start.x;

  if (Math.abs(dx) > 50) {
    if (dx < 0) {
      addPath(start, { ...end, x: end.x + 100 });
      addPath({ ...start, x: start.x - 100 }, end);
    } else {
      addPath(start, { ...end, x: end.x - 100 });
      addPath({ ...start, x: start.x + 100 }, end);
    }
    return;
  }

  addPath(start, end);
}

function datesFor(person) {
  const start = parseGvizDate(person.startDate);
  const end = parseGvizDate(person.endDate);

  if (!start && !end) return "";
  if (start && end) return `${start}-${end}`;
  return start || end;
}

function compareByFirstName(a, b) {
  return firstName(a.name).localeCompare(firstName(b.name), undefined, { sensitivity: "base" });
}

function compareLabMembers(a, b) {
  const aPi = isPrincipalInvestigator(a);
  const bPi = isPrincipalInvestigator(b);

  if (aPi && !bPi) return -1;
  if (!aPi && bPi) return 1;
  return compareByFirstName(a, b);
}

function ensurePrincipalInvestigator(people) {
  const hasRui = people.some(isRuiYang);
  return hasRui ? people : [STATIC_PI, ...people];
}

function makeCard(person) {
  const card = document.createElement("div");
  card.className = "person-card";

  const img = document.createElement("img");
  img.src = safePhoto(person.photo);
  img.alt = person.name;

  const info = document.createElement("div");
  info.className = "person-info";

  const name = document.createElement("div");
  name.className = "person-name";
  name.textContent = person.name;
  info.appendChild(name);

  const role = document.createElement("div");
  role.className = "person-role";
  role.textContent = fallbackTitle(person);
  info.appendChild(role);

  const dates = datesFor(person);
  if (dates) {
    const dateEl = document.createElement("div");
    dateEl.className = "person-dates";
    dateEl.textContent = dates;
    info.appendChild(dateEl);
  }

  if (person.biography) {
    const bio = document.createElement("div");
    bio.className = "person-bio";
    bio.textContent = person.biography;
    info.appendChild(bio);
  }

  card.appendChild(img);
  card.appendChild(info);
  return card;
}

function setEmpty(container, msg) {
  container.innerHTML = `<p class="pub-desc">${msg}</p>`;
}

function renderPeople(container, people, emptyMessage) {
  container.innerHTML = "";

  if (!people.length) {
    setEmpty(container, emptyMessage);
    return;
  }

  people.forEach(person => {
    container.appendChild(makeCard(person));
  });
}

function renderOriginMap(people) {
  const mapEl = document.getElementById("people-origin-map");
  if (!mapEl) return;

  const peopleWithCoordinates = people
    .map(person => ({ ...person, coordinates: parseCoordinates(person.cityOfOrigin) }))
    .filter(person => person.coordinates);

  mapEl.innerHTML = "";

  const mapCanvas = document.createElement("div");
  mapCanvas.className = "people-map-canvas";
  const ghiPoint = coordinateToPoint(GHI_LOCATION.lat, GHI_LOCATION.lng);
  const routeLayer = document.createElementNS(SVG_NS, "svg");
  routeLayer.setAttribute("class", "people-map-routes");
  routeLayer.setAttribute("viewBox", "0 0 100 100");
  routeLayer.setAttribute("preserveAspectRatio", "none");

  peopleWithCoordinates.forEach((person, index) => {
    const originPoint = coordinateToPoint(person.coordinates.lat, person.coordinates.lng);
    appendRoute(routeLayer, originPoint, ghiPoint, index);
  });

  mapCanvas.appendChild(routeLayer);

  peopleWithCoordinates.forEach(person => {
    const { lat, lng } = person.coordinates;
    const { x, y } = coordinateToPoint(lat, lng);
    const photo = safePhoto(person.photo);

    const pin = document.createElement("button");
    pin.className = "people-map-pin";
    pin.type = "button";
    pin.style.left = `${x}%`;
    pin.style.top = `${y}%`;
    pin.setAttribute("aria-label", person.name);
    pin.innerHTML = `
      <span class="people-map-pin-dot"></span>
      <div class="people-map-tooltip-content">
        <img src="${escapeHtml(photo)}" alt="${escapeHtml(person.name)}">
        <div>${escapeHtml(person.name)}</div>
      </div>
    `;

    mapCanvas.appendChild(pin);
  });

  mapEl.appendChild(mapCanvas);
}

/* =========================
   FETCH + RENDER
   ========================= */
document.addEventListener("DOMContentLoaded", async () => {
  const labMembersEl = document.getElementById("people-lab-members");
  const alumniEl     = document.getElementById("people-alumni");
  const collabEl     = document.getElementById("people-close-collaborators");
  const mapEl        = document.getElementById("people-origin-map");

  if (!labMembersEl || !alumniEl || !collabEl || !mapEl) return;

  try {
    const freshUrl = GVIZ_URL + `&cacheBust=${Date.now()}`;
    const res = await fetch(freshUrl, { cache: "no-store" });
    const text = await res.text();

    const m = text.match(/google\.visualization\.Query\.setResponse\((.*)\);?$/s);
    if (!m || !m[1]) throw new Error("Could not parse GViz response.");
    const json = JSON.parse(m[1]);

    let rows = json.table?.rows || [];
    const headerRow = rows[0] && isPeopleHeaderRow(rows[0]);
    const map = headerRow
      ? makeHeaderMapFromRow(rows[0])
      : makeHeaderMap(json.table?.cols || []);

    if (headerRow) rows = rows.slice(1);

    const people = rows.map(row => ({
      name: cleanText(cellValue(row, map, "name")),
      category: cleanText(cellValue(row, map, "category")),
      title: cleanText(cellValue(row, map, "title")),
      photo: cleanText(cellValue(row, map, "photo")),
      startDate: cellValue(row, map, "startdate"),
      endDate: cellValue(row, map, "enddate"),
      biography: cleanText(cellValue(row, map, "biography")),
      cityOfOrigin: cleanText(cellValue(row, map, "cityoforigin")) || findCoordinateCell(row)
    })).filter(person => person.name).map(withPrincipalInvestigatorFallback);

    const labMembers = ensurePrincipalInvestigator(
      people.filter(person => !isAlumni(person) && !isCloseCollaborator(person))
    ).sort(compareLabMembers);

    const alumni = people
      .filter(isAlumni)
      .sort(compareByFirstName);

    const collaborators = people
      .filter(isCloseCollaborator)
      .sort(compareByFirstName);
    const mapPeople = [...labMembers, ...alumni, ...collaborators];

    renderPeople(labMembersEl, labMembers, "No lab members listed.");
    renderPeople(alumniEl, alumni, "No alumni listed.");
    renderOriginMap(mapPeople);
    renderPeople(collabEl, collaborators, "No close collaborators listed.");

  } catch (err) {
    console.error(err);
    renderPeople(labMembersEl, [STATIC_PI], "Error loading people.");
    setEmpty(alumniEl, "Error loading people.");
    setEmpty(mapEl, "Error loading map.");
    setEmpty(collabEl, "Error loading people.");
  }
});
</script>
