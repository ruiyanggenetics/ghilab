<h1>Lab News</h1>

<p>
Announcements, preprints, publications, and lab news from the Yang Lab.
News items are curated and maintained by the lab.
</p>

<div id="news" class="news-list">
  <p>Loading news…</p>
</div>
<button id="news-show-more" class="news-show-more" type="button" hidden>
  Show older news
</button>

<script>
// ### News sheet ###
// The visible news cards come from this published sheet.
const SHEET_ID = "1fiT9YGnIdbJIkTXBlfILtlnoW1TgxmBAe-TYkpHe9nM";
const SHEET_FALLBACK_NAMES = ["YangLab_updates", "Sheet1"];
const NEWS_PREVIEW_LIMIT = 5;

function cleanText(value) {
  return value === null || value === undefined ? "" : String(value).trim();
}

function normKey(value) {
  return cleanText(value).toLowerCase().replace(/[^a-z0-9]+/g, "");
}

function makeHeaderMap(cols) {
  const fallback = {
    date: 0,
    title: 1,
    body: 2,
    link: 4
  };

  const aliases = {
    date: "date",
    sortdate: "date",
    title: "title",
    headline: "title",
    update: "body",
    news: "body",
    body: "body",
    content: "body",
    announcement: "body",
    description: "body",
    link: "link",
    url: "link"
  };

  const map = {};
  cols.forEach((col, index) => {
    const key = aliases[normKey(col.label || col.id)];
    if (key) map[key] = index;
  });

  return { ...fallback, ...map };
}

function cell(row, map, key) {
  return row.c?.[map[key]];
}

function cellText(row, map, key) {
  const value = cell(row, map, key);
  return cleanText(value?.v || value?.f);
}

function isHeaderRow(row) {
  const keys = (row.c || []).map(cell => normKey(cell?.f || cell?.v));
  return keys.includes("date") && keys.includes("title") && (keys.includes("update") || keys.includes("news"));
}

function mapFromHeaderRow(row) {
  const aliases = {
    date: "date",
    sortdate: "date",
    title: "title",
    headline: "title",
    update: "body",
    news: "body",
    body: "body",
    content: "body",
    announcement: "body",
    description: "body",
    link: "link",
    url: "link"
  };
  const map = {};

  (row.c || []).forEach((cell, index) => {
    const key = aliases[normKey(cell?.f || cell?.v)];
    if (key) map[key] = index;
  });

  return { date: 0, title: 1, body: 2, link: 4, ...map };
}

function parseGvizDate(value, formattedValue) {
  if (value instanceof Date) return value;

  if (typeof value === "string" && value.startsWith("Date")) {
    const parts = value.match(/\d+/g);
    if (parts && parts.length >= 3) {
      const dt = new Date(Number(parts[0]), Number(parts[1]), Number(parts[2]));
      if (!isNaN(dt.getTime())) return dt;
    }
  }

  const fallback = Date.parse(cleanText(formattedValue || value));
  return isNaN(fallback) ? new Date(0) : new Date(fallback);
}

// ### News cards ###
// Keep the markup compact; the card height is controlled mostly by CSS.
function makeNewsItem(news) {
  const item = document.createElement("div");
  item.className = "news-item";

  const content = document.createElement("div");
  content.className = "news-content";

  const date = document.createElement("div");
  date.className = "news-date";
  date.textContent = news.dateLabel;
  content.appendChild(date);

  if (news.title) {
    const title = document.createElement("div");
    title.className = "news-title";
    title.textContent = news.title;
    content.appendChild(title);
  }

  const body = document.createElement("div");
  body.className = "news-body";
  body.textContent = news.body;
  content.appendChild(body);

  if (news.link) {
    const link = document.createElement("a");
    link.className = "news-link";
    link.href = news.link;
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = "Read more →";
    content.appendChild(link);
  }

  item.appendChild(content);
  return item;
}

async function fetchSheetJson(sheetName) {
  const sheetUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
  const res = await fetch(sheetUrl);
  const text = await res.text();
  const m = text.match(/google\.visualization\.Query\.setResponse\((.*)\);?$/s);

  if (!m || !m[1]) throw new Error(`Could not parse GViz response for ${sheetName}.`);
  return JSON.parse(m[1]);
}

async function loadNewsSheet() {
  let lastError;

  for (const sheetName of SHEET_FALLBACK_NAMES) {
    try {
      const json = await fetchSheetJson(sheetName);
      const rows = json.table?.rows || [];
      if (rows.length) return { json, sheetName };
    } catch (err) {
      lastError = err;
    }
  }

  if (lastError) throw lastError;
  return { json: { table: { cols: [], rows: [] } }, sheetName: "" };
}

// ### Load and sort news ###
// Newer items stay on top. The first view shows a short list; the button
// reveals the older archive without leaving the page.
loadNewsSheet()
  .then(({ json, sheetName }) => {
    let rows = json.table?.rows || [];
    const container = document.getElementById("news");
    const showMore = document.getElementById("news-show-more");

    container.innerHTML = "";
    showMore.hidden = true;

    if (!rows || rows.length === 0) {
      container.innerHTML = "<p>No news yet.</p>";
      return;
    }

    const firstDataRowIsHeader = rows[0] && isHeaderRow(rows[0]);
    const map = firstDataRowIsHeader
      ? mapFromHeaderRow(rows[0])
      : makeHeaderMap(json.table?.cols || []);

    if (firstDataRowIsHeader) rows = rows.slice(1);

    const newsItems = rows.map(r => {
      const dateCell = cell(r, map, "date");

      return {
        dateLabel: cleanText(dateCell?.f || dateCell?.v),
        sortDate: parseGvizDate(dateCell?.v, dateCell?.f),
        title: cellText(r, map, "title"),
        body: cellText(r, map, "body"),
        link: cellText(r, map, "link")
      };
    }).filter(item => item.body);

    if (!newsItems.length) {
      container.innerHTML = "<p>No news yet.</p>";
      return;
    }

    newsItems.sort((a, b) => b.sortDate.getTime() - a.sortDate.getTime());

    function renderNews(showAll = false) {
      container.innerHTML = "";

      const visibleItems = showAll
        ? newsItems
        : newsItems.slice(0, NEWS_PREVIEW_LIMIT);

      visibleItems.forEach(item => {
        container.appendChild(makeNewsItem(item));
      });

      showMore.hidden = showAll || newsItems.length <= NEWS_PREVIEW_LIMIT;
    }

    showMore.addEventListener("click", () => {
      renderNews(true);
    }, { once: true });

    renderNews(false);
  })
  .catch(() => {
    document.getElementById("news").innerHTML =
      "<p>Unable to load news. Please check sheet permissions.</p>";
  });
</script>
